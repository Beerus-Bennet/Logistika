# LOGISTIKA – Autofotos fürs Auktionshaus einmalig ins Spiel holen.
# GitHub → Actions → „Autofotos holen“ → Run workflow. Holt die Fotos der 77 Autos
# von Wikimedia Commons (500 px) nach cars/ samt cars/credits.json (Urheber, Lizenz)
# und legt sie als Commit ab. Danach braucht das Auktionshaus Wikipedia nicht mehr.
name: Autofotos holen
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Alle Fotos neu holen (sonst nur fehlende)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  carpics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fotos holen
        run: node carpics.mjs ${{ inputs.force && '--force' || '' }}
      - name: Ins Repository legen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cars
          if git diff --cached --quiet; then echo "Keine neuen Fotos."; exit 0; fi
          git commit -m "Autofotos fürs Auktionshaus (Wikimedia Commons)"
          git push
