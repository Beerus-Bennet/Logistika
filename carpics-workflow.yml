# v372: Ausschließlich freigegebene Fotos aus carphotos.js wiederherstellen.
# Modell, Lizenz und SHA-256 bleiben verbindlich; keine automatische Bildsuche.
name: Autofotos holen
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Freigegebene Dateien erneut prüfen und laden"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  carpics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Freigegebene Fotos wiederherstellen
        run: node carpics.mjs ${{ inputs.force && '--force' || '' }}
      - name: Ins Repository legen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cars
          if git diff --cached --quiet; then echo "Keine neuen Fotos."; exit 0; fi
          git commit -m "Freigegebene Autofotos wiederherstellen (Wikimedia Commons)"
          git push
