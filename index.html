<script>
/* v55: Fehler beim Start sichtbar machen (statt still auf der leeren Karte zu landen).
   Die Dateien tragen eine Versionsnummer (?v=…), damit nach einem Update nie
   alte und neue Dateien gemischt aus dem Zwischenspeicher kommen. */
window.LOGI_V = "85";
window.LOGI_ERRS = [];
window.logiErr = function (msg, where) {
  try {
    var t = String(msg || "Fehler") + (where ? " · " + where : "");
    if (window.LOGI_ERRS.indexOf(t) >= 0) return;
    window.LOGI_ERRS.push(t);
    localStorage.setItem("logistika.lastError", new Date().toISOString() + " v" + window.LOGI_V + " " + t);
    var show = function () {
      var b = document.getElementById("bootErr");
      if (!b) { b = document.createElement("div"); b.id = "bootErr"; b.onclick = function () { b.remove(); }; document.body.appendChild(b); }
      b.innerHTML = "<b>⚠️ Fehler im Spiel</b><small>" + window.LOGI_ERRS.slice(-3).map(function (x) { return x.replace(/[<>&]/g, ""); }).join("<br>") + "</small><i>Bitte Screenshot an Claude schicken · antippen zum Schließen</i>";
    };
    if (document.body) show(); else document.addEventListener("DOMContentLoaded", show);
  } catch (e) { /* egal */ }
};
window.addEventListener("error", function (e) {
  var f = e && e.filename ? String(e.filename).split("/").pop().split("?")[0] : "";
  if (e && e.message && (!f || /\.js$/.test(f))) window.logiErr(e.message, f + (e.lineno ? ":" + e.lineno : ""));
});
</script>
